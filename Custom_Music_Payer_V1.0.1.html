<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folder Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0a0f0f;--ink:#e6f5f3;--mute:#7fa09c;--line:#1b2b2a;--acc:#14d9c4;--accink:#001412;--row:#101a19;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px}
h1{font:800 clamp(28px,6vw,40px)/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:10px}
button:focus-visible,input:focus-visible,.row:focus-visible,.drop:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.pick{background:var(--acc);color:var(--accink);padding:11px 18px;font-weight:700}
.pick:hover{filter:brightness(1.08)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--mute);background:var(--panel)}
.drop.over{border-color:var(--acc);color:var(--ink)}
.drop strong{display:block;color:var(--ink);font:700 20px "Bricolage Grotesque",system-ui,sans-serif;margin-bottom:6px}
.player{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;position:sticky;top:8px;z-index:2}
.now{min-width:0}
.now b{display:block;font:700 20px/1.2 "Bricolage Grotesque",system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now span{color:var(--mute);font-size:13px}
.seek{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.seek span:last-child{text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);height:24px;margin:0}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.main{display:flex;align-items:center;gap:6px}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--row);color:var(--ink)}
.ib.on{color:var(--acc);background:var(--row)}
.play{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accink)}
.play:hover{background:var(--acc);color:var(--accink);filter:brightness(1.08)}
svg{width:22px;height:22px;fill:currentColor}
.vol{display:flex;align-items:center;gap:6px;width:130px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--row)}
.row.cur{background:var(--row);box-shadow:inset 3px 0 0 var(--acc)}
.row .n{color:var(--mute);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.row.cur .n{color:var(--acc)}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{font-weight:700}
.row .d{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:12px;text-align:center}
[hidden]{display:none!important}
@media (max-width:480px){.vol{display:none}.ctrl{justify-content:center}}
</style>
</head>
<body>
<main>
 <header>
  <div><h1>Folder Player</h1><div class="sub" id="count">Nothing loaded yet</div></div>
  <div>
   <button class="pick" id="pickBtn">Choose folder</button>
   <input type="file" id="folder" webkitdirectory directory multiple hidden>
   <input type="file" id="files" accept=".mp3,audio/mpeg" multiple hidden>
  </div>
 </header>

 <div class="drop" id="drop">
  <strong>Drop a folder of MP3s here</strong>
  Or choose a folder above. Files stay on your device.
  <div style="margin-top:10px"><button id="pickFiles" style="text-decoration:underline;color:var(--acc)">Pick individual files instead</button></div>
 </div>

 <section class="player" id="player" hidden aria-label="Player">
  <div class="now"><b id="title">&nbsp;</b><span id="pos"></span></div>
  <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  <div class="ctrl">
   <div class="main">
    <button class="ib" id="shuffle" aria-label="Shuffle" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.6l-3 3.6-1.5-1.3L13 6.7 13.5 6H17V3zM3 6h4.5l9 11H17v-3l4 4-4 4v-3h-1.5L6.5 8H3V6zm0 10h4l1.7-2 1.5 1.3L8.5 18H3v-2z"/></svg></button>
    <button class="ib" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button class="ib play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ib" id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg></button>
    <button class="ib" id="repeat" aria-label="Repeat" title="Repeat: off"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
   </div>
   <div class="vol"><svg viewBox="0 0 24 24" style="color:var(--mute)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4z"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
  </div>
 </section>

 <ol class="list" id="list" hidden></ol>
 <div class="note" id="hint" hidden>Space plays or pauses. Left and right arrows skip 5 seconds. N and P change tracks.</div>
</main>

<script>
(function(){
 var tracks=[],idx=-1,shuffleOn=false,repeat=0,order=[],audio=new Audio();
 audio.preload='metadata';
 var $=function(id){return document.getElementById(id)};
 var list=$('list'),seek=$('seek'),seeking=false;

 function fmt(s){if(!isFinite(s))return '0:00';s=Math.floor(s);var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r}
 function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function clean(name){return name.replace(/\.mp3$/i,'').replace(/_/g,' ').replace(/^\s*\d{1,3}\s*[-.)]\s*/,'')}

 function load(fileList){
  var files=Array.prototype.slice.call(fileList).filter(function(f){return /\.mp3$/i.test(f.name)||f.type==='audio/mpeg'});
  if(!files.length){$('count').textContent='No MP3 files found in that selection';return}
  files.sort(function(a,b){var pa=a.webkitRelativePath||a.name,pb=b.webkitRelativePath||b.name;return pa.localeCompare(pb,undefined,{numeric:true,sensitivity:'base'})});
  tracks.forEach(function(t){URL.revokeObjectURL(t.url)});
  audio.pause();
  tracks=files.map(function(f){return {file:f,url:URL.createObjectURL(f),title:clean(f.name),dur:null}});
  idx=-1;buildOrder();render();
  $('drop').hidden=true;$('player').hidden=false;list.hidden=false;$('hint').hidden=false;
  $('count').textContent=tracks.length+(tracks.length===1?' track':' tracks');
  play(0);
  readDurations(0);
 }

 function readDurations(i){
  if(i>=tracks.length)return;
  var t=tracks[i],a=new Audio();a.preload='metadata';
  var done=function(){a.removeAttribute('src');setDur(i,a.duration);readDurations(i+1)};
  a.onloadedmetadata=done;a.onerror=function(){readDurations(i+1)};
  a.src=t.url;
 }
 function setDur(i,d){if(!tracks[i]||!isFinite(d))return;tracks[i].dur=d;var el=list.children[i];if(el)el.querySelector('.d').textContent=fmt(d)}

 function render(){
  list.innerHTML=tracks.map(function(t,i){
   return '<li class="row" tabindex="0" data-i="'+i+'"><span class="n">'+(i+1)+'</span><span class="t">'+esc(t.title)+'</span><span class="d">'+(t.dur?fmt(t.dur):'')+'</span></li>';
  }).join('');
 }

 function buildOrder(){
  order=tracks.map(function(_,i){return i});
  if(shuffleOn){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=order[i];order[i]=order[j];order[j]=x}
   if(idx>=0){var k=order.indexOf(idx);order.splice(k,1);order.unshift(idx)}}
 }

 function play(i){
  if(i<0||i>=tracks.length)return;
  idx=i;var t=tracks[i];
  audio.src=t.url;
  audio.play().catch(function(){});
  $('title').textContent=t.title;
  $('pos').textContent='Track '+(i+1)+' of '+tracks.length;
  document.title=t.title+' · Folder Player';
  Array.prototype.forEach.call(list.children,function(el,k){el.classList.toggle('cur',k===i)});
  var cur=list.children[i];if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:'Folder Player'})}catch(e){}}
 }

 function step(dir,auto){
  if(!tracks.length)return;
  var p=order.indexOf(idx),n=p+dir;
  if(n>=order.length){if(repeat===1||!auto){n=0}else{audio.pause();audio.currentTime=0;return}}
  if(n<0)n=order.length-1;
  play(order[n]);
 }

 function setIcon(playing){
  $('playIcon').innerHTML=playing?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-label',playing?'Pause':'Play');
 }
 function toggle(){if(idx<0)return;audio.paused?audio.play():audio.pause()}

 audio.addEventListener('play',function(){setIcon(true)});
 audio.addEventListener('pause',function(){setIcon(false)});
 audio.addEventListener('loadedmetadata',function(){$('dur').textContent=fmt(audio.duration);setDur(idx,audio.duration)});
 audio.addEventListener('timeupdate',function(){
  $('cur').textContent=fmt(audio.currentTime);
  if(!seeking&&audio.duration)seek.value=Math.round(audio.currentTime/audio.duration*1000);
 });
 audio.addEventListener('ended',function(){if(repeat===2){audio.currentTime=0;audio.play()}else step(1,true)});
 audio.addEventListener('error',function(){if(idx>=0&&tracks.length>1)step(1,true)});
 audio.volume=.8;

 seek.addEventListener('input',function(){seeking=true;if(audio.duration)$('cur').textContent=fmt(seek.value/1000*audio.duration)});
 seek.addEventListener('change',function(){if(audio.duration)audio.currentTime=seek.value/1000*audio.duration;seeking=false});
 $('vol').addEventListener('input',function(e){audio.volume=e.target.value/100});
 $('play').onclick=toggle;
 $('next').onclick=function(){step(1,false)};
 $('prev').onclick=function(){if(audio.currentTime>3){audio.currentTime=0}else step(-1,false)};
 $('shuffle').onclick=function(){shuffleOn=!shuffleOn;this.classList.toggle('on',shuffleOn);this.title='Shuffle: '+(shuffleOn?'on':'off');buildOrder()};
 $('repeat').onclick=function(){repeat=(repeat+1)%3;this.classList.toggle('on',repeat>0);this.title='Repeat: '+['off','playlist','track'][repeat]};

 list.addEventListener('click',function(e){var r=e.target.closest('.row');if(r)play(+r.dataset.i)});
 list.addEventListener('keydown',function(e){if(e.key==='Enter'){var r=e.target.closest('.row');if(r){e.preventDefault();play(+r.dataset.i)}}});

 document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'&&e.target.type!=='range'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key===' '&&tag!=='button'){e.preventDefault();toggle()}
  else if(e.key==='ArrowRight'&&tag!=='input'){audio.currentTime+=5}
  else if(e.key==='ArrowLeft'&&tag!=='input'){audio.currentTime-=5}
  else if(e.key==='n'||e.key==='N'){step(1,false)}
  else if(e.key==='p'||e.key==='P'){$('prev').click()}
 });
 if('mediaSession' in navigator){
  try{navigator.mediaSession.setActionHandler('nexttrack',function(){step(1,false)});
  navigator.mediaSession.setActionHandler('previoustrack',function(){step(-1,false)})}catch(e){}
 }

 $('pickBtn').onclick=function(){$('folder').click()};
 $('pickFiles').onclick=function(){$('files').click()};
 $('folder').onchange=function(e){load(e.target.files);e.target.value=''};
 $('files').onchange=function(e){load(e.target.files);e.target.value=''};

 var drop=$('drop');
 ['dragenter','dragover'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over')})});
 ['dragleave','drop'].forEach(function(ev){window.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over')})});
 window.addEventListener('drop',function(e){
  var items=e.dataTransfer&&e.dataTransfer.items;
  if(items&&items.length&&items[0].webkitGetAsEntry){
   var out=[],pending=0,finished=false;
   var check=function(){if(finished&&pending===0)load(out)};
   var walk=function(entry,path){
    if(entry.isFile){pending++;entry.file(function(f){try{Object.defineProperty(f,'webkitRelativePath',{value:path+f.name})}catch(x){}out.push(f);pending--;check()},function(){pending--;check()})}
    else if(entry.isDirectory){pending++;var rd=entry.createReader(),all=[];
     (function read(){rd.readEntries(function(es){if(es.length){all=all.concat(es);read()}else{all.forEach(function(c){walk(c,path+entry.name+'/')});pending--;check()}},function(){pending--;check()})})()}
   };
   for(var i=0;i<items.length;i++){var en=items[i].webkitGetAsEntry();if(en)walk(en,'')}
   finished=true;check();
  }else if(e.dataTransfer&&e.dataTransfer.files.length){load(e.dataTransfer.files)}
 });
})();
</script>
</body>
</html>
